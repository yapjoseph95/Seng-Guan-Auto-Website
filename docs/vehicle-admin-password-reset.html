<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seng Guan Auto 管理后台密码重置</title>
</head>
<body style="margin:0;background:#101112;color:#f5f5f5;font-family:Arial,sans-serif">
  <div style="max-width:480px;margin:0 auto;padding:32px 16px">
    <div style="background:#191b1d;border:1px solid #343638;border-top:3px solid #eb302c;border-radius:8px;padding:24px">
      <p style="margin:0 0 16px;color:#f5f5f5;font-size:14px;font-weight:bold;letter-spacing:1px">SENG GUAN AUTO</p>
      <h1 style="margin:0 0 12px;font-size:24px">重置管理后台密码</h1>
      <p style="margin:0 0 20px;color:#c4c6c8;line-height:1.6">我们收到了重置管理后台密码的请求。请点击下方按钮设置新密码。</p>
      <p style="margin:0 0 20px;text-align:center"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;background:#eb302c;border-radius:6px;color:#ffffff;font-size:16px;font-weight:bold;text-decoration:none">重置密码</a></p>
      <p style="margin:0;color:#c4c6c8;font-size:14px;line-height:1.6">请勿与他人分享重置链接。如果这次请求并非由你发起，可以忽略这封邮件。</p>
    </div>
  </div>
</body>
</html>
